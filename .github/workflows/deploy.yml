name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

# Alchemy state is shared, so deploys run one at a time and are never cut off midway.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # The backend tests deploy a real Worker to Cloudflare, so they are not part of this gate.
      - run: pnpm --filter @scream-club/frontend test

      - name: Deploy to production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
        # An unset value would deploy without that binding and silently stop confirmation emails.
        run: |
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN RESEND_API_KEY EMAIL_REPLY_TO; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set for GitHub Actions in this repository."
              exit 1
            fi
          done
          pnpm exec alchemy deploy --stage prod --yes
